[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "access-review"
version = "1.0.0"
description = "权限复核辅助命令行工具 - 帮助安全团队每季度进行用户权限清单审计、复核状态记录和异常权限检测"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Security Team" }]
keywords = ["security", "access-review", "permission-audit", "iam"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
access-review = "access_review.cli:app"

[tool.setuptools.packages.find]
include = ["access_review*"]
